<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title description">
  <title id="title">Project Flow workflow</title>
  <desc id="description">A project workflow that starts with a new or active project, frames its outcome and risk, researches and chooses, maps search phrases to website titles and content when relevant, designs and delivers, validates, then continues at the current stage or closes with a report. Active security testing requires confirmed authorization and scope.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#8CA0A5"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#567078"/>
    </marker>
  </defs>

  <rect width="1440" height="840" rx="22" fill="#081216"/>
  <path d="M52 143H1388" stroke="#203238" stroke-width="1"/>

  <text x="52" y="76" fill="#F2F7F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.7">One workflow, scaled to the project</text>
  <text x="52" y="111" fill="#A8B9BD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Start where the work is. Add depth only when scope and risk call for it.</text>
  <rect x="1088" y="53" width="300" height="42" rx="10" fill="#0F1D22" stroke="#2A4148"/>
  <circle cx="1111" cy="74" r="5" fill="#48D7BD"/>
  <text x="1127" y="80" fill="#D6E5E7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="650" letter-spacing="0.4">CATEGORY-AWARE · RISK-SCALED</text>

  <!-- New and active projects converge on the same project-aware workflow. -->
  <rect x="52" y="325" width="152" height="84" rx="13" fill="#101D22" stroke="#30464D" stroke-width="1.5"/>
  <circle cx="75" cy="351" r="5" fill="#48D7BD"/>
  <text x="90" y="356" fill="#F0F6F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="650">New project</text>
  <text x="70" y="385" fill="#A8B9BD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Choose a category</text>

  <rect x="52" y="443" width="152" height="84" rx="13" fill="#101D22" stroke="#30464D" stroke-width="1.5"/>
  <circle cx="75" cy="469" r="5" fill="#75B8FF"/>
  <text x="90" y="474" fill="#F0F6F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5" font-weight="650">Active work</text>
  <text x="70" y="503" fill="#A8B9BD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Resume current stage</text>

  <path d="M204 367H225V426H246M204 485H225V426" fill="none" stroke="#8CA0A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M225 426H246" fill="none" stroke="#8CA0A5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Main stages -->
  <g>
    <rect x="252" y="246" width="258" height="360" rx="14" fill="#101D22" stroke="#30464D" stroke-width="1.5"/>
    <path d="M267 247H495" stroke="#48D7BD" stroke-width="3" stroke-linecap="round"/>
    <circle cx="280" cy="279" r="16" fill="#173A38"/>
    <text x="280" y="284" fill="#7BE7D2" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">01</text>
    <text x="307" y="286" fill="#F2F7F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="650">Frame</text>
    <g fill="none" stroke="#48D7BD" stroke-width="2" stroke-linecap="round">
      <circle cx="481" cy="277" r="9"/>
      <circle cx="481" cy="277" r="3"/>
      <path d="M481 263V268M481 286V291M467 277H472M490 277H495"/>
    </g>
    <path d="M272 306H490" stroke="#293B41"/>
    <circle cx="279" cy="350" r="4" fill="#48D7BD"/>
    <text x="296" y="356" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">Clarify the outcome</text>
    <circle cx="279" cy="406" r="4" fill="#48D7BD"/>
    <text x="296" y="412" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="296">New: choose a category</tspan>
      <tspan x="296" dy="23">Active: resume current stage</tspan>
    </text>
    <circle cx="279" cy="478" r="4" fill="#48D7BD"/>
    <text x="296" y="484" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="296">Set depth to match</tspan>
      <tspan x="296" dy="23">scope and risk</tspan>
    </text>
  </g>

  <path d="M510 426H526" stroke="#8CA0A5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="532" y="246" width="258" height="360" rx="14" fill="#101D22" stroke="#30464D" stroke-width="1.5"/>
    <path d="M547 247H775" stroke="#75B8FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="560" cy="279" r="16" fill="#1A3042"/>
    <text x="560" y="284" fill="#A7D1FF" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">02</text>
    <text x="587" y="286" fill="#F2F7F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="650">Research</text>
    <g fill="none" stroke="#75B8FF" stroke-width="2" stroke-linecap="round">
      <circle cx="759" cy="274" r="7"/>
      <path d="M764 280 770 286"/>
    </g>
    <path d="M552 306H770" stroke="#293B41"/>
    <circle cx="559" cy="350" r="4" fill="#75B8FF"/>
    <text x="576" y="356" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">Load relevant skills only</text>
    <circle cx="559" cy="406" r="4" fill="#75B8FF"/>
    <text x="576" y="412" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="576">Check current trends when</tspan>
      <tspan x="576" dy="23">they could change a decision</tspan>
    </text>
    <circle cx="559" cy="478" r="4" fill="#75B8FF"/>
    <text x="576" y="484" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="576">Compare user value, effort,</tspan>
      <tspan x="576" dy="23">and risk</tspan>
    </text>
    <circle cx="559" cy="540" r="4" fill="#75B8FF"/>
    <text x="576" y="546" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="576">Search-led website?</tspan>
      <tspan x="576" dy="22">SEO: map search phrases</tspan>
      <tspan x="576" dy="21">Edit titles + page copy</tspan>
    </text>
  </g>

  <path d="M790 426H806" stroke="#8CA0A5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="812" y="246" width="258" height="360" rx="14" fill="#101D22" stroke="#30464D" stroke-width="1.5"/>
    <path d="M827 247H1055" stroke="#B9A2FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="840" cy="279" r="16" fill="#2A2540"/>
    <text x="840" y="284" fill="#D2C4FF" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">03</text>
    <text x="867" y="286" fill="#F2F7F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="21" font-weight="650">Design &amp; build</text>
    <g fill="none" stroke="#B9A2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1035" y="268" width="18" height="18" rx="3"/>
      <path d="M1041 274H1047M1041 280H1047"/>
    </g>
    <path d="M832 306H1050" stroke="#293B41"/>
    <circle cx="839" cy="350" r="4" fill="#B9A2FF"/>
    <text x="856" y="356" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">Fix user-flow friction</text>
    <circle cx="839" cy="406" r="4" fill="#B9A2FF"/>
    <text x="856" y="412" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="856">When UX is in scope,</tspan>
      <tspan x="856" dy="23">define the simplest usable UI</tspan>
    </text>
    <circle cx="839" cy="478" r="4" fill="#B9A2FF"/>
    <text x="856" y="484" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="856">Deliver the smallest</tspan>
      <tspan x="856" dy="23">complete change</tspan>
    </text>
  </g>

  <path d="M1070 426H1086" stroke="#8CA0A5" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="1092" y="246" width="258" height="360" rx="14" fill="#101D22" stroke="#30464D" stroke-width="1.5"/>
    <path d="M1107 247H1335" stroke="#FFC979" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1120" cy="279" r="16" fill="#3A3020"/>
    <text x="1120" y="284" fill="#FFD995" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">04</text>
    <text x="1147" y="286" fill="#F2F7F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="650">Validate</text>
    <g fill="none" stroke="#FFC979" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1322 266 1334 271V280C1334 287 1329 291 1322 294 1315 291 1310 287 1310 280V271Z"/>
      <path d="M1318 280 1321 283 1327 276"/>
    </g>
    <path d="M1112 306H1330" stroke="#293B41"/>
    <circle cx="1119" cy="350" r="4" fill="#FFC979"/>
    <text x="1136" y="356" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">Match checks to scope + risk</text>
    <circle cx="1119" cy="406" r="4" fill="#FFC979"/>
    <text x="1136" y="412" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="1136">Active security tests need</tspan>
      <tspan x="1136" dy="23">confirmed permission + scope</tspan>
    </text>
    <circle cx="1119" cy="478" r="4" fill="#FFC979"/>
    <text x="1136" y="484" fill="#DCE7E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5">
      <tspan x="1136">Continue at this stage,</tspan>
      <tspan x="1136" dy="23">or close with findings + risks</tspan>
    </text>
  </g>

  <!-- The final stage can hand off or resume without restarting the project. -->
  <path d="M1221 606V633H987M1221 633H1218" fill="none" stroke="#567078" stroke-width="2" stroke-linecap="round"/>
  <path d="M987 633V672M1218 633V672" fill="none" stroke="#8CA0A5" stroke-width="2" marker-end="url(#arrow-muted)"/>

  <rect x="886" y="674" width="202" height="82" rx="13" fill="#10231F" stroke="#37675D" stroke-width="1.5"/>
  <circle cx="910" cy="699" r="5" fill="#48D7BD"/>
  <text x="925" y="705" fill="#83E5D1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="650">Continue</text>
  <text x="906" y="733" fill="#C8D8D8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Resume current stage</text>

  <rect x="1116" y="674" width="222" height="82" rx="13" fill="#1B2029" stroke="#485064" stroke-width="1.5"/>
  <circle cx="1140" cy="699" r="5" fill="#B9A2FF"/>
  <text x="1155" y="705" fill="#D2C4FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="650">Close with a report</text>
  <text x="1136" y="733" fill="#C8D8D8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">Decisions, checks, and risks</text>

  <text x="52" y="720" fill="#F2F7F8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="650">A safe, useful default</text>
  <text x="52" y="750" fill="#A8B9BD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">
    <tspan x="52">Small work stays lean. Active security tests require</tspan>
    <tspan x="52" dy="23">confirmed authorization and target scope.</tspan>
  </text>
  <path d="M52 798H1388" stroke="#203238" stroke-width="1"/>
  <text x="52" y="822" fill="#84979C" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">Relevant tools only · current evidence when it matters · validation matched to risk</text>
</svg>

